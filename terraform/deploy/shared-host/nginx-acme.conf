# Port 80. Serves the ACME challenge and sends everything else to HTTPS.
# Separate from the 443 block, which cannot load until the certificate exists.
#
# Install as /etc/nginx/sites-available/zz-traffic-acme and enable it before
# requesting the certificate.
server {
    listen 80;
    server_name ${PUBLIC_DOMAIN};

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# HTTPS. Install as /etc/nginx/sites-available/zz-traffic and enable it after
# the certificate has been issued.
#
# The frontend and the API share this one origin, so the browser never makes a
# cross-origin request and CORS is not involved. The stack binds only to
# loopback; this block is the only way in.
server {
    listen 443 ssl http2;
    server_name ${PUBLIC_DOMAIN};

    ssl_certificate     /etc/letsencrypt-traffic/live/${PUBLIC_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt-traffic/live/${PUBLIC_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Longest prefix wins, so this beats the / location below.
    location /api/ {
        proxy_pass http://127.0.0.1:3390;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_set_header Host $host;
    }
}
